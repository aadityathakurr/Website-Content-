<!doctype html><html><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S&M module preview</title><style>body{margin:0;background:#FAFAFA}/* HotWax Systems | Module: S&M Banner
   Self-contained: every class starts with .hwx-banner, so it will not clash with the HubSpot theme.
   Colors, image, height and width come from the module fields through the CSS variables
   set on the <section> in module.html. */

.hwx-banner{
  --hwx-banner-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --hwx-banner-body:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:var(--hwx-banner-min-h,680px);
  color:var(--hwx-banner-text,#fff);
  font-family:var(--hwx-banner-body);
  background:
    radial-gradient(ellipse 55% 60% at 50% 50%, rgba(20,4,6,calc(var(--hwx-banner-overlay,.4) * 1.05)) 0%, rgba(20,4,6,0) 100%),
    linear-gradient(180deg,
      rgba(26,6,9,var(--hwx-banner-overlay,.4)) 0%,
      rgba(26,6,9,calc(var(--hwx-banner-overlay,.4) * .75)) 50%,
      rgba(18,4,6,calc(var(--hwx-banner-overlay,.4) * 1.45)) 100%),
    var(--hwx-banner-img,none) var(--hwx-banner-pos,center) / cover no-repeat,
    var(--hwx-banner-fallback,#2a0b0e);
}
.hwx-banner *,.hwx-banner *::before,.hwx-banner *::after{box-sizing:border-box}

.hwx-banner__inner{
  flex:1;
  width:100%;
  max-width:var(--hwx-banner-width,980px);
  margin:0 auto;
  padding:48px max(20px, env(safe-area-inset-right,0px)) 64px max(20px, env(safe-area-inset-left,0px));
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}
.hwx-banner--center .hwx-banner__inner{align-items:center;text-align:center}
.hwx-banner--left .hwx-banner__inner{align-items:flex-start;text-align:left}

/* eyebrow */
.hwx-banner__eyebrow{
  margin:0 0 22px;
  font:600 15px/1.4 var(--hwx-banner-body);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--hwx-banner-text,#fff);
  opacity:.88;
  --hwx-banner-to:.88;
}
.hwx-banner--center .hwx-banner__eyebrow{padding-left:.16em}
.hwx-banner__tm{
  font-size:.62em;
  line-height:0;
  position:relative;
  top:-.55em;
  vertical-align:baseline;
  letter-spacing:0;
  margin-left:-.14em;
  margin-right:.06em;
}

/* headline */
.hwx-banner__title{
  margin:0;
  max-width:14em;
  font-family:var(--hwx-banner-display);
  font-weight:700;
  font-size:clamp(38px,5vw,68px);
  line-height:1.1;
  letter-spacing:-.015em;
  color:var(--hwx-banner-text,#fff);
  text-wrap:balance;
}
.hwx-banner__hl{color:var(--hwx-banner-highlight,#ff6a2b)}

/* subheadline (rich text) */
.hwx-banner__sub{
  margin-top:24px;
  max-width:54ch;
  font-size:18px;
  line-height:1.65;
  font-weight:300;
  color:var(--hwx-banner-text,#fff);
  opacity:.82;
  --hwx-banner-to:.82;
}
.hwx-banner__sub p{margin:0}
.hwx-banner__sub p + p{margin-top:12px}
.hwx-banner__sub strong,.hwx-banner__sub b{font-weight:500;opacity:1}

/* button */
.hwx-banner__actions{
  margin-top:36px;
  display:flex;
  flex-wrap:wrap;
  gap:16px 24px;
  align-items:center;
}
.hwx-banner--center .hwx-banner__actions{justify-content:center}
.hwx-banner__btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:17px 28px;
  border:0;
  border-radius:999px;
  background:var(--hwx-banner-btn-bg,#e70000);
  color:var(--hwx-banner-btn-text,#fff);
  font:600 15px/1 var(--hwx-banner-body);
  text-decoration:none;
  box-shadow:0 10px 24px -10px rgba(231,0,0,.65);
  transition:transform .15s ease, filter .15s ease;
}
.hwx-banner__btn:hover{transform:translateY(-1px);filter:brightness(.92);color:var(--hwx-banner-btn-text,#fff)}
.hwx-banner__btn svg{transition:transform .15s ease}
.hwx-banner__btn:hover svg{transform:translateX(3px)}
.hwx-banner__btn:focus-visible{outline:3px solid #00a2e1;outline-offset:3px}

/* small proof line under the button */
.hwx-banner__note{
  margin:18px 0 0;
  font-size:13.5px;
  letter-spacing:.02em;
  color:var(--hwx-banner-note-color,#fff);
  opacity:var(--hwx-banner-note-opacity,.62);
  --hwx-banner-to:var(--hwx-banner-note-opacity,.62);
}

/* load-in animation (can be switched off in the module's Style tab) */
/* the animation ends at each element's own opacity (--hwx-banner-to), so softer lines stay soft after it */
@keyframes hwxBannerUp{from{opacity:0;transform:translateY(18px)}to{opacity:var(--hwx-banner-to,1);transform:none}}
.hwx-banner--animate .hwx-banner__inner > *{animation:hwxBannerUp .8s cubic-bezier(.2,.7,.2,1) both}
.hwx-banner--animate .hwx-banner__inner > *:nth-child(2){animation-delay:.08s}
.hwx-banner--animate .hwx-banner__inner > *:nth-child(3){animation-delay:.16s}
.hwx-banner--animate .hwx-banner__inner > *:nth-child(4){animation-delay:.24s}
.hwx-banner--animate .hwx-banner__inner > *:nth-child(5){animation-delay:.32s}

/* tablets */
@media (max-width:1020px){
  .hwx-banner{min-height:min(var(--hwx-banner-min-h,680px), 540px)}
  .hwx-banner__inner{padding-block:40px 52px}
}
/* phones */
@media (max-width:760px){
  .hwx-banner__note--desktop-only{display:none}
}
@media (max-width:560px){
  .hwx-banner{min-height:0}
  .hwx-banner__inner{padding-block:32px 44px}
  .hwx-banner__sub{font-size:16px}
  .hwx-banner__btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  .hwx-banner--animate .hwx-banner__inner > *{animation:none}
  .hwx-banner__btn,.hwx-banner__btn svg{transition:none}
}

/* theme guard -----------------------------------------------------------------
   HubSpot themes colour every link (a, a:link, a:visited) and often do it with
   !important from a high-specificity selector such as `body #hs_cos_wrapper a`.
   That is what turned this CTA blue. Three things are needed to win reliably:
     1. higher specificity than the theme  -> the module class is repeated
     2. !important                         -> beats the theme's own !important
     3. -webkit-text-fill-color            -> Safari/iOS honour this OVER `color`,
        which is why the button can stay blue on mobile even when desktop is fixed
   The colour itself still comes from the module's "Button text" field. */

.hwx-banner.hwx-banner a.hwx-banner__btn,
.hwx-banner.hwx-banner a.hwx-banner__btn:link,
.hwx-banner.hwx-banner a.hwx-banner__btn:visited,
.hwx-banner.hwx-banner a.hwx-banner__btn:hover,
.hwx-banner.hwx-banner a.hwx-banner__btn:focus,
.hwx-banner.hwx-banner a.hwx-banner__btn:active,
.hwx-banner.hwx-banner a.hwx-banner__btn *{
  color:var(--hwx-banner-btn-text,#fff)!important;
  -webkit-text-fill-color:var(--hwx-banner-btn-text,#fff)!important;
  text-decoration:none!important;
}
/* the arrow is stroked with currentColor, so pin it to the same value */
.hwx-banner.hwx-banner a.hwx-banner__btn svg,
.hwx-banner.hwx-banner a.hwx-banner__btn svg path{
  stroke:var(--hwx-banner-btn-text,#fff)!important;
  fill:none!important;
}

/* body copy links keep the banner's own text colour in every state */
.hwx-banner.hwx-banner .hwx-banner__sub a,
.hwx-banner.hwx-banner .hwx-banner__sub a:link,
.hwx-banner.hwx-banner .hwx-banner__sub a:visited,
.hwx-banner.hwx-banner .hwx-banner__sub a:hover,
.hwx-banner.hwx-banner .hwx-banner__sub a:focus,
.hwx-banner.hwx-banner .hwx-banner__sub a:active{
  color:var(--hwx-banner-text,#fff)!important;
  -webkit-text-fill-color:var(--hwx-banner-text,#fff)!important;
  text-decoration:underline;
}

/* headline, eyebrow and note must not inherit a theme heading colour either */
.hwx-banner.hwx-banner .hwx-banner__title,
.hwx-banner.hwx-banner .hwx-banner__eyebrow,
.hwx-banner.hwx-banner .hwx-banner__sub{
  color:var(--hwx-banner-text,#fff);
  -webkit-text-fill-color:var(--hwx-banner-text,#fff);
}
/* the proof line has its own colour and opacity (Style tab) */
.hwx-banner.hwx-banner .hwx-banner__note{
  color:var(--hwx-banner-note-color,#fff)!important;
  -webkit-text-fill-color:var(--hwx-banner-note-color,#fff);
  opacity:var(--hwx-banner-note-opacity,.62);
  --hwx-banner-to:var(--hwx-banner-note-opacity,.62);
}
.hwx-banner.hwx-banner .hwx-banner__hl{
  color:var(--hwx-banner-highlight,#ff6a2b);
  -webkit-text-fill-color:var(--hwx-banner-highlight,#ff6a2b);
}
</style></head><body>
