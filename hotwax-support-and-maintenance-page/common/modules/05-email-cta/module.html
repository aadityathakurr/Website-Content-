<!-- Mid-page email CTA. In HubSpot, place this module directly after the Services module.
     Replace the <form> with a one-field HubSpot form (email) and keep the wrapper classes. -->
<section class="cta-bar-section">
  <div class="wrap">
<!-- Mid-page CTA: same pattern as the Moqui page. On HubSpot, swap this form for a one-field HubSpot form. -->
    <div class="cta-bar">
      <div class="cta-bar__copy">
        <h2 class="cta-bar__title">Talk to an Apache OFBiz Expert</h2>
        <p>Have an Apache OFBiz system that needs attention? Connect with our Apache OFBiz experts to talk through upgrades, fixes, and ongoing support for your business.</p>
      </div>
      <form class="cta-bar__form" id="ctaBarForm" novalidate>
        <label class="sr" for="cta-email">Work email</label>
        <input id="cta-email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
        <button type="submit">Submit</button>
        <p class="cta-bar__msg" id="ctaBarMsg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
